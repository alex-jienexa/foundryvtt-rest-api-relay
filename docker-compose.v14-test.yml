# Isolated smoke-test deployment for the Foundry v14 headless-auth fix.
# This intentionally does NOT read .env and does NOT mount ./data (production data).
# Run with: docker compose -p foundry-relay-v14-test -f docker-compose.v14-test.yml up -d --build
#
# Host networking lets the headless Chrome process reach the test relay at
# 127.0.0.1:3012, so a dedicated Foundry test world can point its module there.

services:
  relay-v14-test:
    image: foundry-relay:v14-headless-test
    build:
      context: .
      dockerfile: go-relay/Dockerfile
    container_name: foundry-relay-v14-headless-test
    network_mode: host
    environment:
      APP_ENV: production
      PORT: "3012"
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/relay-v14-test.db
      DATA_DIR: /app/data
      ALLOW_HEADLESS: "true"
      FOUNDRY_USER_ID: ${FOUNDRY_USER_ID:-}
      CAPTURE_BROWSER_CONSOLE: warn
    volumes:
      - ./data-v14-headless-test:/app/data
    shm_size: "1gb"
    restart: "no"
